<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a18" />
    <title>暂时离线 · 共鸣</title>
    <style>
      :root { color-scheme: dark; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: #070a18; color: #f4ecff; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
      main { max-width: 24rem; padding: 2rem; text-align: center; }
      .icon { font-size: 2rem; color: #d8a7ff; }
      h1 { font-size: 1.5rem; }
      p { color: #a99bc4; line-height: 1.8; }
      button { min-height: 44px; margin-top: 1rem; padding: .75rem 1.5rem; border: 0; border-radius: 2rem; background: linear-gradient(135deg, #d8a7ff, #7ec8ff); color: #101321; font: inherit; cursor: pointer; touch-action: manipulation; }
      button:focus-visible { outline: 2px solid #d8a7ff; outline-offset: 4px; }
      button:active { opacity: .8; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">♫</div>
      <h1>暂时连不上网络</h1>
      <p>连接恢复后，就能继续打开你们的空间。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
